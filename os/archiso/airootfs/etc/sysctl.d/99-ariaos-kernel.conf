# AriaOS Kernel Tuning Profile — Ultra-Low Latency & Anti-Freeze Configuration
# Prioritizes interactive desktop & AI responsiveness over background disk writeback stalls.

# Minimize swap aggressiveness unless under real memory pressure
vm.swappiness = 10

# Keep VFS inode/dentry caches warm for instant file manager & AI connector lookups
vm.vfs_cache_pressure = 50

# Prevent large background writes (e.g. ISOs, models, packages) from stalling interactive UI threads
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15

# Avoid OOM lockups by compacting memory proactively
vm.compaction_proactiveness = 20
vm.page-cluster = 0

# Scheduler autogrouping for responsive desktop / GUI sessions
kernel.sched_autogroup_enabled = 1
kernel.nmi_watchdog = 0

# Fast network sockets for local IPC & web throughput
net.core.somaxconn = 4096
net.ipv4.tcp_fastopen = 3

