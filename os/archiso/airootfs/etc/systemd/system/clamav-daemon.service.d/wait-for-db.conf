[Unit]
ConditionPathExistsGlob=/var/lib/clamav/*.c[vl]d
After=clamav-freshclam.service network-online.target

[Service]
RuntimeDirectory=clamav
RuntimeDirectoryMode=0755
ExecStartPre=+/bin/sh -c 'if [ -f /etc/clamav/clamd.conf ]; then sed -i "s|^#LocalSocket /run/clamav/clamd.ctl|LocalSocket /run/clamav/clamd.ctl|" /etc/clamav/clamd.conf; grep -q "^LocalSocket " /etc/clamav/clamd.conf || echo "LocalSocket /run/clamav/clamd.ctl" >> /etc/clamav/clamd.conf; fi'
