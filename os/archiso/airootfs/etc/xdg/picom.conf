# AriaOS Minimalist macOS Compositor Configuration
backend = "xrender";
vsync = true;

# Rounded corners on all windows (like macOS)
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'AriaTopBar'"
];

# Soft natural drop shadows
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.28;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-exclude = [
  "name = 'Notification'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'AriaDesktopCanvas'",
  "class_g = 'AriaTopBar'",
  "class_g = 'AriaFloatingDock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Smooth fading
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 6;
