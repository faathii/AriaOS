<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Cyber Octagon/Rounded Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)" stroke="url(#accent)" stroke-width="2.2"/>
  <rect x="8" y="8" width="48" height="48" rx="10" fill="none" stroke="#00ff88" stroke-width="0.6" stroke-opacity="0.35"/>
  <!-- Corner HUD Accents -->
  <path d="M 10 16 L 10 11 L 15 11" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 54 16 L 54 11 L 49 11" fill="none" stroke="#00b4d8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 10 48 L 10 53 L 15 53" fill="none" stroke="#00b4d8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 54 48 L 54 53 L 49 53" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <path d="M 32 13 L 47 19 L 47 32 C 47 42 32 50 32 50 C 32 50 17 42 17 32 L 17 19 Z" fill="none" stroke="url(#accent)" stroke-width="2.6" stroke-linejoin="round"/>
        <polyline points="24,32 30,38 41,25" fill="none" stroke="#00ff88" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
