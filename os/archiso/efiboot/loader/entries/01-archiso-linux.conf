title    AriaOS Neural Kernel (%ARCH%, UEFI)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=2G zswap.enabled=1 zswap.compressor=zstd zswap.max_pool_percent=25 preempt=full threadirqs nowatchdog nmi_watchdog=0 %KERNEL_PARAMS% quiet splash loglevel=3 vt.global_cursor_default=0
