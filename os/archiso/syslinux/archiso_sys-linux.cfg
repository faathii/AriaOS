LABEL arch
TEXT HELP
Boot the AriaOS Cyber Obsidian Live / Install medium on BIOS.
Includes AriaDE Desktop, Aria Neural Kernel Core, and Cyber Obsidian Suite.
ENDTEXT
MENU LABEL AriaOS Cyber Obsidian — Neural Kernel (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=2G zswap.enabled=0 preempt=full threadirqs nowatchdog nmi_watchdog=0 mitigations=auto %KERNEL_PARAMS% quiet splash loglevel=3 vt.global_cursor_default=0

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Arch Linux install medium on BIOS with speakup screen reader.
It allows you to install Arch Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Arch Linux install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
